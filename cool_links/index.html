<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Cool Links</title>
  <link rel="icon" href="../favicon.ico">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #161616;
      --surface-hover: #1c1c1c;
      --text: #f2f2f0;
      --text-muted: #8a8a86;
      --accent: #ff4a3d;
      --border: #2a2a28;
      --focus: #f2f2f0;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Header */
    .site-header {
      border-bottom: 2px solid var(--text);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .site-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .site-title .accent {
      color: var(--accent);
    }

    /* Main */
    main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    .intro {
      max-width: 60ch;
      margin: 0 0 2.5rem;
      font-size: 1rem;
      color: var(--text-muted);
    }

    .intro strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Status */
    .status {
      font-size: 0.875rem;
      color: var(--text-muted);
      padding: 1rem 0;
    }

    .status[hidden] {
      display: none;
    }

    .status.error {
      color: var(--accent);
    }

    /* Grid */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0;
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
    }

    .link-grid[hidden] {
      display: none;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1.25rem 1.25rem 1.5rem;
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
      position: relative;
    }

    .link-card:hover {
      background: var(--surface-hover);
    }

    .link-card:hover .card-title {
      color: var(--accent);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
      transition: color 0.15s ease;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.45;
    }

    /* Mobile */
    @media (max-width: 520px) {
      .header-inner {
        padding: 1rem;
      }

      .site-title {
        font-size: 1.25rem;
      }

      main {
        padding: 1.5rem 1rem 2rem;
      }

      .link-grid {
        grid-template-columns: 1fr;
      }

      .link-card {
        padding: 1rem 1rem 1.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">Cool<span class="accent">/</span>Links</h1>
    </div>
  </header>

  <main>
    <div class="status" id="status" role="status" aria-live="polite">Загрузка ссылок…</div>
    <div class="link-grid" id="linkGrid" hidden></div>
  </main>

  <script>
    (function () {
      'use strict';

      var statusEl = document.getElementById('status');
      var gridEl = document.getElementById('linkGrid');

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function parseLinks(text) {
        var result = [];
        var lines = text.split(/\r?\n/);

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line || line.charAt(0) === '#') continue;

          var parts = line.split('|');
          if (parts.length < 2) continue;

          var title = parts[0].trim();
          var url = parts[1].trim();
          var desc = parts.length > 2 ? parts.slice(2).join('|').trim() : '';

          if (!title || !url) continue;
          if (!/^https?:\/\//i.test(url)) continue;

          result.push({ title: title, url: url, desc: desc });
        }
        return result;
      }

      function createCard(link) {
        var a = el('a', 'link-card');
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.setAttribute('aria-label', link.title + ' — открыть в новой вкладке');

        a.appendChild(el('h2', 'card-title', link.title));
        if (link.desc) a.appendChild(el('p', 'card-desc', link.desc));

        return a;
      }

      function render(links) {
        if (!gridEl) return;
        var fragment = document.createDocumentFragment();
        links.forEach(function (link) {
          fragment.appendChild(createCard(link));
        });
        gridEl.appendChild(fragment);
        gridEl.hidden = false;
        if (statusEl) statusEl.hidden = true;
      }

      function showError(message) {
        if (!statusEl) return;
        statusEl.hidden = false;
        statusEl.classList.add('error');
        statusEl.textContent = message;
        if (gridEl) gridEl.hidden = true;
      }

      function load() {
        fetch('links.txt', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function (text) {
            var links = parseLinks(text);
            if (!links.length) {
              showError('Список ссылок пуст или содержит ошибки формата.');
              return;
            }
            render(links);
          })
          .catch(function (err) {
            showError('Не удалось загрузить links.txt. Проверьте соединение и запустите проект через HTTP-сервер. (' + err.message + ')');
          });
      }

      load();
    })();
  </script>
</body>
</html>
